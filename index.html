<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" content="#CFE6F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Exercícios do Davi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Tema único e deliberado (livro ilustrado) */
  :root{
    color-scheme:light;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    --page:#E3EEF3; --paper:#FFFFFF; --ink:#26313D; --mute:#56657A;
    --sky:#CFE6F2; --brick:#B5523B; --door:#C8322E; --sage:#7FA66B; --wood:#8A5A3C;
    --sage-lt:#DDEDD3; --butter:#F6D66B; --butter-lt:#FDF1C4; --red-lt:#F8D9D2;
    --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  *{-webkit-tap-highlight-color:transparent}
  body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
       touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .shell{max-width:1120px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
  h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,.part:focus-visible{outline:3px solid var(--door);outline-offset:3px}

  .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{flex:none}
  .brand h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.01em}
  .brand p{color:var(--mute);font-size:15px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .star{color:#D9A400}
  .eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}

  /* Tela de unidades */
  .units{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
  .unitcard{text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:0;overflow:hidden;display:flex;flex-direction:column}
  .unitcard:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  .unitcard .art{background:var(--sky);border-bottom:3px solid var(--ink);height:190px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}
  .unitcard .art svg{height:100%;width:auto}
  .unitcard .art img{width:92px;height:92px;object-fit:contain}
  .unitcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
  .unitcard h2{font-size:32px;font-weight:800}
  .unitcard .gram{font-size:15px;color:var(--mute)}
  .unitcard .meta{display:flex;gap:8px;flex-wrap:wrap}
  .bar{height:10px;border-radius:5px;background:#D2DCE3;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--sage)}
  .tipbox{background:var(--butter-lt);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:15px}

  /* Barra da unidade + passos (a ordem é real) */
  .unitbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .unitbar h2{font-size:clamp(26px,4vw,36px);font-weight:800}
  .unitbar .grow{flex:1}
  .back{border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:6px 14px;font-family:var(--display);font-weight:700;font-size:17px;box-shadow:2px 2px 0 var(--ink)}
  .steps{display:flex;flex-wrap:wrap;gap:10px}
  .step{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:8px 16px 8px 8px;box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-weight:700;font-size:19px}
  .step:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .step .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sky);border:2px solid var(--ink);font-size:17px}
  .step[aria-current="step"]{background:var(--butter)}
  .step[aria-current="step"] .n{background:var(--paper)}
  .step small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--mute);line-height:1.1}

  /* Explorar */
  .stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
  .frame{background:var(--sky);border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
  .frame svg{display:block;width:100%;height:auto}
  .hint{font-size:15px;color:var(--mute);margin-top:10px}
  .card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px}
  .zoombox{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sky)}
  .zoombox svg{display:block;width:100%;height:auto;aspect-ratio:4/3;max-width:100%}
  .zoombox.photo{background:#F4F8FA;display:grid;place-items:center;aspect-ratio:4/3}
  .zoombox.photo img{width:62%;height:auto;max-height:90%;object-fit:contain}
  .wordrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .word{font-size:clamp(34px,5vw,46px);font-weight:800;color:var(--brick)}
  .pt{font-size:19px}
  .som{font-size:15px;color:var(--mute)}
  .som b{color:var(--ink);letter-spacing:.04em}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;letter-spacing:.04em;text-transform:uppercase}
  .tag.uk{background:var(--butter-lt)}
  .tag.us{background:#EEF1F4;color:var(--mute);border-color:#9AA6B4;text-decoration:line-through;text-decoration-thickness:2px}
  .tag.prova{background:var(--door);color:#fff;border-color:var(--door)}
  .tag.num{background:var(--sage-lt)}
  .ex{display:flex;gap:10px;align-items:flex-start;background:var(--page);border-radius:12px;padding:10px 12px}
  .ex .en{font-weight:700}
  .ex .ptx{color:var(--mute);font-size:15px}
  .note{font-size:15px;border-left:4px solid var(--butter);padding-left:10px}
  .yourturn{font-family:var(--display);font-weight:700;font-size:18px;color:#4F7F3E}
  .say{flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--butter);width:48px;height:48px;box-shadow:2px 2px 0 var(--ink)}
  .say.sm{width:36px;height:36px;box-shadow:none}
  .say:active{transform:translate(1px,1px)}

  .chipgroups{display:flex;flex-direction:column;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:5px 12px;font-weight:700;font-size:15px}
  .chip.seen{background:var(--sage-lt)}
  .chip.seen::before{content:"✓ ";color:#3E7A2F}
  .chip.on{background:var(--butter)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .count{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
  .go{border:3px solid var(--ink);border-radius:14px;background:var(--door);color:#fff;font-family:var(--display);font-weight:800;font-size:21px;padding:10px 22px;box-shadow:4px 4px 0 var(--ink)}
  .go.alt{background:var(--paper);color:var(--ink)}
  .go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

  /* Guarda-roupa (Unit 7) */
  .wardrobe{background:#E9DCC6;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:14px;position:relative}
  .wardrobe::before{content:"";display:block;height:8px;border-radius:4px;background:var(--wood);margin:0 6px 12px}
  .rack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .item{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:2px 2px 0 var(--ink)}
  .item img{width:100%;aspect-ratio:1;object-fit:contain;pointer-events:none}
  .item span{font-weight:700;font-size:14px}
  .item.seen{background:#F3F9EF}
  .item.hl{outline:4px dashed #E8412E;outline-offset:2px;background:var(--butter-lt)}
  .item.bad{outline:4px dashed #56657A;outline-offset:2px}
  @media (max-width:560px){.rack{grid-template-columns:repeat(3,minmax(0,1fr))}}

  /* Painel de gramática */
  .grammar h3{font-size:26px;font-weight:800}
  .gtable{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .gbox{border:2px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--page)}
  .gbox h4{margin:0;font-family:var(--display);font-size:20px;font-weight:800}
  .gline{display:flex;gap:8px;align-items:center}
  .gline .en{font-weight:700}
  .gline .ptx{color:var(--mute);font-size:14px}
  .key{background:var(--butter);border-radius:4px;padding:0 4px}

  /* Jogos */
  .game{max-width:720px;margin:0 auto;width:100%}
  .progress{display:flex;gap:6px;flex-wrap:wrap}
  .progress i{width:22px;height:8px;border-radius:4px;background:#D2DCE3}
  .progress i.done{background:var(--sage)}
  .progress i.miss{background:var(--door)}
  .progress i.now{background:var(--butter);outline:2px solid var(--ink)}
  .ask{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ask h2{font-size:clamp(26px,4vw,34px);font-weight:800}
  .ask .ptq{color:var(--mute);font-size:16px}
  .sentence{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,32px);line-height:1.2}
  .blank{display:inline-block;min-width:64px;border-bottom:4px solid var(--ink);text-align:center;color:var(--brick)}
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:10px;align-items:center}
  .optbtn{flex:1;text-align:left;border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:10px 16px;font-family:var(--display);font-weight:800;font-size:clamp(21px,3.2vw,26px);box-shadow:3px 3px 0 var(--ink)}
  .optbtn:disabled{cursor:default}
  .optbtn.ok{background:var(--sage-lt);border-color:#3E7A2F}
  .optbtn.no{background:var(--red-lt);border-color:var(--door)}
  .feedback{font-family:var(--display);font-weight:800;font-size:22px;min-height:1.2em}
  .feedback.ok{color:#3E7A2F}
  .feedback.no{color:var(--door)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .pop{animation:pop .3s}
  @keyframes pop{50%{transform:scale(1.06)}}

  .slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .slot{width:42px;height:54px;border-bottom:4px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px;color:var(--brick)}
  .slot.gap{width:18px;border:0}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .tile{min-width:54px;height:54px;padding:0 10px;border:3px solid var(--ink);border-radius:12px;background:var(--butter-lt);font-family:var(--display);font-weight:800;font-size:26px;box-shadow:3px 3px 0 var(--ink)}
  .tile:disabled{opacity:.25;box-shadow:none;cursor:default}
  .tile.hintme{background:var(--butter);animation:pop .6s infinite}
  .wslots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;padding:8px;border:2px dashed #9AA6B4;border-radius:14px}
  .wslot{font-family:var(--display);font-weight:800;font-size:26px;color:var(--brick);padding:2px 8px;border-bottom:4px solid var(--ink)}

  .outfit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:#F4F8FA;border:2px solid var(--ink);border-radius:12px;padding:12px}
  .outfit .who{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:800;font-size:20px}
  .outfit .who svg{width:84px;height:92px}
  .outfit .wear{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .outfit .wear img{width:74px;height:74px;object-fit:contain;background:var(--paper);border:2px solid #C6D0D8;border-radius:10px;padding:4px}
  .likepic{display:flex;align-items:center;justify-content:center;gap:18px;background:#F4F8FA;border:2px solid var(--ink);border-radius:12px;padding:12px}
  .likepic img{width:120px;height:120px;object-fit:contain}
  .likepic svg{width:90px;height:90px}

  .result{text-align:center;align-items:center}
  .big{font-size:clamp(40px,7vw,64px);font-weight:800;color:var(--brick);font-family:var(--display)}
  .stars{font-size:34px;letter-spacing:4px;color:#D9A400}
  .intro{display:flex;flex-direction:column;gap:12px}
  .intro h2{font-size:clamp(30px,4.4vw,40px);font-weight:800}
  .foot{display:flex;justify-content:flex-end;gap:10px;align-items:center;font-size:14px;color:var(--mute)}
  .link{background:none;border:0;text-decoration:underline;color:var(--mute);padding:4px}

  /* Casa */
  .part{cursor:pointer;transition:filter .15s}
  .part:hover{filter:brightness(1.08) saturate(1.1)}
  .hlbox{fill:none;stroke:#E8412E;stroke-width:4;stroke-dasharray:10 6;pointer-events:none;animation:march 1s linear infinite}
  .hlbox.bad{stroke:#56657A}
  @keyframes march{to{stroke-dashoffset:-32}}
  .smoke circle{animation:puff 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .smoke circle:nth-child(2){animation-delay:1.1s}
  .smoke circle:nth-child(3){animation-delay:2.2s}
  @keyframes puff{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:.9}100%{opacity:0;transform:translateY(-18px) scale(1.4)}}

  @media (prefers-reduced-motion: reduce){ .hlbox,.smoke circle,.tile.hintme,.shake,.pop{animation:none} }
  @media (max-width: 860px){ .stage{grid-template-columns:1fr} }
  @media (max-width: 480px){
    .step{font-size:17px;padding-right:12px}
    .step small{display:none}
    .slot{width:30px;height:46px;font-size:24px}
    .tile{min-width:46px;height:48px;font-size:22px}
  }
</style>
</head>
<body>

<!-- Texturas compartilhadas -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#B5523B"/><path d="M0 .5H24M0 6.5H24M6 0V6M18 6V12" stroke="#94412F" stroke-width="1" fill="none"/></pattern>
    <pattern id="tiles" width="14" height="9" patternUnits="userSpaceOnUse"><rect width="14" height="9" fill="#5B6573"/><path d="M0 9Q3.5 3 7 9Q10.5 3 14 9" fill="none" stroke="#434B57" stroke-width="1.2"/></pattern>
    <pattern id="stone" width="30" height="18" patternUnits="userSpaceOnUse"><rect width="30" height="18" fill="#8C7B6A"/><path d="M0 .5H30M0 9.5H30M10 0V9M24 9V18" stroke="#6F604F" fill="none"/></pattern>
    <pattern id="bathtile" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#D6EDE9"/><path d="M0 .5H14M.5 0V14" stroke="#B9DAD3" fill="none"/></pattern>
  </defs>
</svg>

<!-- Desenho da casa (usado no explorar, nos recortes e no jogo de tocar) -->

  <g class="part" data-k="loft">
    <polygon points="192,205 380,92 568,205" fill="#E6D2AE"/>
    <path d="M380 92 300 205M380 92 460 205" stroke="#C9AE82" stroke-width="4"/>

let voices = [];

function pickVoice(lang){
  return voices.find(v => v.lang === lang && /enhanced|premium|serena|daniel|kate|libby|sonia|google/i.test(v.name))
      || voices.find(v => v.lang === lang)
      || voices.find(v => v.lang && v.lang.replace('_','-').startsWith(lang))
      || null;
}
function say(text, lang='en-GB', rate=.85){
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate;
    const v = pickVoice(lang); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}

function houseZoom(k, withBox=true){
  const w = BY6[k];

  const [x,y,wd,ht] = w.box;
  const ar = 4/3; let W = wd, H = ht;
  if (W/H > ar) H = W/ar; else W = H*ar;
  c.setAttribute('viewBox', [x-(W-wd)/2, y-(H-ht)/2, W, H].join(' '));
  c.setAttribute('preserveAspectRatio','xMidYMid slice');
  c.setAttribute('aria-hidden','true');
  c.style.pointerEvents = 'none';
  if (withBox) setHL(c, w.box);
  const box = document.createElement('div'); box.className = 'zoombox'; box.appendChild(c);

}

const roomName = r => 'the ' + BY6[r].en;
function otherFact(room){
  const here = FACTS.filter(f => f.room === room).map(f => f.en.split(' ').pop());
  return pickOne(FACTS.filter(f => f.room !== room && !here.includes(f.en.split(' ').pop())));
}
UNITS.u6.gram = function(){
  const type = pickOne(['isare','short','short','qword']);
  const f = pickOne(FACTS);
  const isW = f.pl ? 'are' : 'is';
  if (type === 'isare'){
    const full = `There ${isW} ${f.en} in ${roomName(f.room)}.`;
    return {pic: houseZoom(f.room), title:'Is or are?', sub:'Complete a frase',
      sentence:`There <span class="blank">___</span> ${f.en} in ${roomName(f.room)}.`,
      opts:[{t:'is',ok:!f.pl},{t:'are',ok:!!f.pl}], full, hint: f.pl ? 'Mais de um → are' : 'Só um → is'};
  }
  if (type === 'qword'){
    const Q = f.pl ? 'Are' : 'Is';
    const full = `${Q} there ${f.en} in ${roomName(f.room)}?`;
    return {pic: houseZoom(f.room), title:'Is or are?', sub:'Complete a pergunta',
      sentence:`<span class="blank">___</span> there ${f.en} in ${roomName(f.room)}?`,
      opts:[{t:'Is',ok:!f.pl},{t:'Are',ok:!!f.pl}], full, hint: f.pl ? 'Mais de um → Are' : 'Só um → Is'};
  }
  // resposta curta: olha a figura e responde sim ou não
  const truth = Math.random() < .5;
  const room = truth ? f.room : pickOne(Object.keys(BY6).filter(k => BY6[k].prova && FACTS.some(x => x.room === k)));
  const thing = truth ? f : otherFact(room);
  const Q = thing.pl ? 'Are' : 'Is';
  const q = `${Q} there ${thing.en} in ${roomName(room)}?`;
  const yes = thing.pl ? 'Yes, there are.' : 'Yes, there is.';
  const no  = thing.pl ? "No, there aren't." : "No, there isn't.";
  const wrong = thing.pl ? 'Yes, there is.' : 'Yes, there are.';
  const has = FACTS.some(x => x.room === room && x.en === thing.en);
  return {pic: houseZoom(room), title:q, sub:'Olhe a figura e responda', sentence:'',
    opts: shuffle([{t:yes,ok:has},{t:no,ok:!has},{t:wrong,ok:false}]),
    full: `${q} ${has ? yes : no}`, speakQ:q};
};
UNITS.u6.build = function(){
  const f = pickOne(FACTS);
  const asQ = Math.random() < .4;
  const isW = f.pl ? 'are' : 'is';
  const place = BY6[f.room];
  if (asQ){
    const Q = f.pl ? 'Are' : 'Is';
    return {pic: houseZoom(f.room), words:`${Q} there ${f.en} in the ${place.en}`.split(' '), end:'?', pt:`Tem ${f.pt} ${place.ptIn}?`};
  }
  return {pic: houseZoom(f.room), words:`There ${isW} ${f.en} in the ${place.en}`.split(' '), end:'.', pt:`Tem ${f.pt} ${place.ptIn}.`};
};

UNITS.u7.gram = function(){

      hint: c.pl ? 'Palavra no plural → these' : 'Uma coisa só → this'};
  }
  if (type === 'like'){

      opts: shuffle([{t:'Yes, I do.',ok:likes},{t:"No, I don't.",ok:!likes},{t: likes ? 'Yes, I am.' : "No, I'm not.",ok:false}]),
      full:`${q} ${likes ? 'Yes, I do.' : "No, I don't."}`, speakQ:q};
  }
  const o = makeOutfit();
  const wearing = Math.random() < .5;
  let c;
  if (wearing) c = pickOne(o.items);

  return {pic: outfitPic(o), title:q, sub:`Olhe o que ${o.name} está vestindo`, sentence:'',
    opts: shuffle([{t:yes,ok:wearing},{t:no,ok:!wearing},{t: wearing ? `Yes, ${o.he} does.` : `No, ${o.he} doesn't.`,ok:false}]),
    full:`${q} ${wearing ? yes : no}`, speakQ:q};
};
UNITS.u7.build = function(){

    const c = pickOne(CLOTHES);
    return {pic: clothPic(c.k), words:`Do you like ${c.pl ? 'these' : 'this'} ${c.en}`.split(' '), end:'?', pt:`Você gosta ${c.ptDem}?`};
  }
  const o = makeOutfit();
  const c = pickOne(o.items);
  const pron = o.girl ? 'Ela' : 'Ele';
  if (t === 'wearQ') return {pic: outfitPic(o), words:`Is ${o.he} wearing ${c.art}${c.en}`.split(' '), end:'?', pt:`${pron} está usando ${c.ptA}?`};
  return {pic: outfitPic(o), words:`${o.He} is wearing ${c.art}${c.en}`.split(' '), end:'.', pt:`${pron} está usando ${c.ptA}.`};
};

  }
  const pick = el => { if (el) openWord(el.dataset.k, true); };
  exploreBoard.addEventListener('click', e => pick(e.target.closest('.part')));
  exploreBoard.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('part') && e.target.tagName !== 'BUTTON'){ e.preventDefault(); pick(e.target); } });
  $('#chips').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openWord(b.dataset.open, true); });
  openWord(U.words[0].k, false);
}
function openWord(k, speak){
  const w = U.by[k]; current = k;
  const st = S[U.id];
  if (speak){ st.seen[k] = 1; save(); say(w.en); }
  U.mark(exploreBoard, k);
  const dem = U.id === 'u7' ? `<span class="tag num">${w.pl ? 'plural · these' : 'singular · this'}</span>` : '';
  const card = $('#wordCard');
  card.innerHTML = `
    <div class="picslot"></div>
    <div class="wordrow"><h2 class="word" lang="en-GB">${esc(w.en)}</h2>${sayBtn(w.en, true)}</div>
    <p class="som">Fala-se mais ou menos: <b>${w.som}</b></p>
    <p class="pt">Em português: <b>${w.pt}</b></p>
    <div class="tags">${w.prova ? '<span class="tag prova">Cai na prova</span>' : ''}${dem}${w.us ? `<span class="tag uk">Inglaterra: ${esc(w.en)}</span><span class="tag us">EUA: ${w.us}</span>` : ''}</div>
    <div class="ex">${sayBtn(w.ex)}<div><p class="en" lang="en-GB">${esc(w.ex)}</p><p class="ptx">${w.exPt}</p></div></div>
    ${w.note ? `<p class="note">${w.note}</p>` : ''}
    <p class="yourturn">Sua vez: repita bem alto!</p>`;
  card.querySelector('.picslot').replaceWith(U.id === 'u6' ? houseZoom(k, false) : clothPic(k));
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  renderChips();
}
function renderChips(){
  const st = S[U.id];
  const chip = w => `<button class="chip ${st.seen[w.k]?'seen':''} ${current===w.k?'on':''}" data-open="${w.k}" lang="en-GB">${esc(w.en)}</button>`;
  const prova = U.words.filter(w => w.prova), bonus = U.words.filter(w => !w.prova);
  $('#chips').innerHTML = `<p class="eyebrow">Cai na prova</p><div class="chips">${prova.map(chip).join('')}</div>` +
    (bonus.length ? `<p class="eyebrow">Bônus</p><div class="chips">${bonus.map(chip).join('')}</div>` : '');
  const n = prova.filter(w => st.seen[w.k]).length;
  $('#seenLine').textContent = `${n} de ${prova.length} palavras da prova descobertas`;
}

/* ---------- motor de perguntas de múltipla escolha ---------- */
function vocabQ(w){
  const pool = U.words.filter(x => x.k !== w.k && (x.prova || !w.prova));
  return {pic: U.pic(w.k), title:"What's this?", sub:'O que é isso?', sentence:'', k:w.k,
    opts: shuffle([{t:w.en,ok:true}, ...shuffle(pool).slice(0,2).map(x => ({t:x.en,ok:false}))]),
    full: w.en, vocab:true};
}
function renderMCQ(box, q, header, onDone){
  box.innerHTML = `${header}
    <div class="picslot"></div>
    <div class="ask"><h2 lang="en-GB">${esc(q.title)}</h2>${q.speakQ ? sayBtn(q.speakQ) : ''}<span class="ptq">${q.sub}</span></div>
    ${q.sentence ? `<p class="sentence" lang="en-GB">${q.sentence}</p>` : ''}
    <div class="opts">${q.opts.map((o,i) => `
      <div class="opt"><button class="optbtn" data-i="${i}" lang="en-GB">${esc(o.t)}</button>${sayBtn(o.t)}</div>`).join('')}</div>
    <p class="feedback" aria-live="polite"></p>
    <div class="row next" hidden><span></span><button class="go">Próxima →</button></div>`;
  if (q.pic) box.querySelector('.picslot').replaceWith(q.pic); else box.querySelector('.picslot').remove();
  if (q.speakQ) setTimeout(() => say(q.speakQ), 200);
  const fb = box.querySelector('.feedback');
  box.querySelectorAll('.optbtn').forEach(b => b.onclick = () => {
    box.querySelectorAll('.optbtn').forEach(x => x.disabled = true);
    const o = q.opts[+b.dataset.i];
    const right = box.querySelector(`.optbtn[data-i="${q.opts.findIndex(x => x.ok)}"]`);
    if (o.ok){
      b.classList.add('ok','pop');
      const p = praise();
      fb.className = 'feedback ok'; fb.textContent = `${p} ★`;
      say(`${q.full} ${p}`);
    } else {
      b.classList.add('no','shake'); right.classList.add('ok');
      fb.className = 'feedback no';
      fb.innerHTML = q.vocab ? `Quase! Este é o <span lang="en-GB">${esc(q.full)}</span>.` : `Quase! ${q.hint ? q.hint + '. ' : ''}O certo é: <span lang="en-GB">${esc(q.full)}</span>`;
      say(q.vocab ? `This is the ${q.full}.` : q.full);
    }
    onDone(o.ok);
  });
}

/* ---------- 2. RELEMBRAR ---------- */
let R = null;
function recallIntro(){
  const st = S[U.id];
  const n = U.words.filter(w => w.prova && st.seen[w.k]).length, tot = U.words.filter(w => w.prova).length;
  $('#stepBody').innerHTML = `<div class="game"><div class="card intro">
    <p class="eyebrow">Passo 2 · Relembrar</p>
    <h2>Você lembra?</h2>
    <p>São 10 perguntas: 6 de vocabulário e 4 de gramática (${U.gramLabel}). Se precisar, toque no alto-falante para ouvir cada resposta antes de escolher.</p>
    ${n < tot ? `<p class="note">Você descobriu ${n} de ${tot} palavras da prova. Dá para jogar, mas fica mais fácil explorando todas antes.</p>` : ''}
    <div class="row"><button class="go" id="startRecall">Começar</button><button class="go alt" data-goto="explore">Explorar mais</button></div>
  </div></div>`;
  $('#startRecall').onclick = startRecall;
}
function startRecall(){
  const st = S[U.id];
  const prova = U.words.filter(w => w.prova);
  const seen = shuffle(prova.filter(w => st.seen[w.k])), rest = shuffle(prova.filter(w => !st.seen[w.k]));
  const vocab = seen.concat(rest).slice(0, 6);
  const pattern = ['v','v','g','v','g','v','v','g','v','g'];
  let vi = 0;
  R = {items: pattern.map(t => t === 'v' ? {t, w: vocab[vi++ % vocab.length]} : {t}), i:0, marks:[], missed:[], gramMiss:0};
  $('#stepBody').innerHTML = '<div class="game"><div class="card" id="qbox"></div></div>';
  recallQ();
}
function recallQ(){
  const it = R.items[R.i];
  const q = it.t === 'v' ? vocabQ(it.w) : U.gram();
  const box = $('#qbox');
  const header = `<div class="row"><p class="eyebrow">Relembrar · ${R.i+1} de ${R.items.length} · ${it.t === 'v' ? 'vocabulário' : 'gramática'}</p>${progressBar(R.items.length, R.marks, R.i)}</div>`;
  renderMCQ(box, q, header, ok => {
    const st = S[U.id];
    R.marks[R.i] = ok ? 'done' : 'miss';
    if (it.t === 'v'){
      st.seen[it.w.k] = 1;
      st.m[it.w.k] = ok ? Math.min(3,(st.m[it.w.k]||0)+1) : Math.max(0,(st.m[it.w.k]||0)-1);
      if (!ok) R.missed.push(it.w.k);
    } else if (!ok) R.gramMiss++;
    if (ok) bumpStars(); else save();
    const nx = box.querySelector('.next'); nx.hidden = false;
    const b = nx.querySelector('button'); if (R.i+1 === R.items.length) b.textContent = 'Ver resultado →';
    b.focus();
    b.onclick = () => { R.i++; R.i < R.items.length ? recallQ() : recallEnd(); };
  });
}
function recallEnd(){
  const st = S[U.id];
  const right = R.marks.filter(m => m === 'done').length;
  st.missed = [...new Set(R.missed)]; st.gramMiss = R.gramMiss; save();
  const stars = right >= 9 ? 3 : right >= 6 ? 2 : 1;
  $('#qbox').innerHTML = `<div class="result intro">
    <p class="eyebrow">Relembrar · resultado</p>
    <p class="big">${right} de ${R.items.length}</p>
    <p class="stars" aria-label="${stars} estrelas">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
    ${st.missed.length ? `<p>Palavras para treinar no reforço:</p><div class="chips" style="justify-content:center">${st.missed.map(k => `<span class="chip" lang="en-GB">${esc(U.by[k].en)}</span>`).join('')}</div>` : '<p>Vocabulário todo certo!</p>'}
    ${R.gramMiss ? `<p>Errou ${R.gramMiss} de gramática. O reforço vai ter mais frases para montar.</p>` : '<p>Gramática toda certa!</p>'}
    <div class="row" style="justify-content:center"><button class="go" data-goto="reinforce">Reforçar agora →</button><button class="go alt" id="againRecall">Jogar de novo</button></div>
  </div>`;
  say(right >= 8 ? 'Brilliant! Well done!' : 'Good try! Let’s practise.');
  $('#againRecall').onclick = startRecall;
}

/* ---------- 3. REFORÇAR ---------- */
let F = null;
function reinIntro(){
  const st = S[U.id];
  $('#stepBody').innerHTML = `<div class="game"><div class="card intro">
    <p class="eyebrow">Passo 3 · Reforçar</p>
    <h2>Ouça, toque, escreva e monte</h2>
    <p>Quatro jogos misturados: <b>ouvir e tocar</b>, <b>escrever a palavra</b>, <b>montar a frase</b> e <b>responder a pergunta</b>.</p>
    <p class="note">${st.missed.length
      ? `Vou repetir mais vezes: <b lang="en-GB">${st.missed.map(k => esc(U.by[k].en)).join(', ')}</b>.`
      : 'Faça o Relembrar antes para eu saber o que treinar mais. Sem ele, escolho as palavras que você ainda não domina.'}</p>
    <div class="row"><button class="go" id="startRein">Começar (10 rodadas)</button>${st.missed.length ? '' : '<button class="go alt" data-goto="recall">Ir para Relembrar</button>'}</div>
  </div></div>`;
  $('#startRein').onclick = startRein;
}
function startRein(){
  const st = S[U.id];
  const prova = U.words.filter(w => w.prova).map(w => w.k);
  const base = st.missed.filter(k => prova.includes(k));
  const weak = shuffle(prova.filter(k => !base.includes(k) && (st.m[k]||0) < 2));
  const rest = shuffle(prova.filter(k => !base.includes(k) && !weak.includes(k)));
  let words = [...base, ...base, ...weak, ...rest].slice(0, 5);
  words = shuffle(words);
  for (let i = 1; i < words.length; i++) if (words[i] === words[i-1]){ const j = words.findIndex((x,idx) => idx > i && x !== words[i]); if (j > -1) [words[i],words[j]] = [words[j],words[i]]; }
  // mais gramática se errou gramática no Relembrar
  const pattern = st.gramMiss >= 2
    ? ['tap','build','gram','spell','build','tap','gram','build','spell','gram']
    : ['tap','build','spell','gram','tap','build','spell','gram','tap','build'];
  let wi = 0;
  F = {items: pattern.map(t => (t === 'tap' || t === 'spell') ? {t, k: words[wi++ % words.length]} : {t}), i:0, marks:[], right:0};
  $('#stepBody').innerHTML = '<div class="game"><div class="card" id="qbox"></div></div>';
  reinRound();
}
function reinHeader(){ return `<div class="row"><p class="eyebrow">Reforçar · ${F.i+1} de ${F.items.length}</p>${progressBar(F.items.length, F.marks, F.i)}</div>`; }
const nextRow = () => `<div class="row next" hidden><span></span><button class="go">${F.i+1 < F.items.length ? 'Próxima →' : 'Ver resultado →'}</button></div>`;
function reinDone(ok, k){
  const st = S[U.id];
  F.marks[F.i] = ok ? 'done' : 'miss';
  if (ok){ F.right++; bumpStars(); } else save();
  if (k) st.m[k] = ok ? Math.min(3,(st.m[k]||0)+1) : Math.max(0,(st.m[k]||0)-1);
  save();
  const nx = $('#qbox .next'); nx.hidden = false;
  const b = nx.querySelector('button');
  if (F.i+1 === F.items.length) b.textContent = 'Ver resultado →';
  b.focus();
  b.onclick = () => { F.i++; F.i < F.items.length ? reinRound() : reinEnd(); };
}
function reinRound(){
  const it = F.items[F.i];
  if (it.t === 'tap') tapRound(U.by[it.k]);
  else if (it.t === 'spell') spellRound(U.by[it.k]);
  else if (it.t === 'build') buildRound(U.build());
  else renderMCQ($('#qbox'), U.gram(), reinHeader(), ok => reinDone(ok));
}

// Ouça e toque
function tapRound(w){
  const box = $('#qbox');
  box.innerHTML = `${reinHeader()}
    <div class="ask"><h2 lang="en-GB">Listen and tap!</h2><span class="ptq">${U.tapHint}</span></div>
    <div class="row" style="justify-content:flex-start">${sayBtn(w.en, true)}<span>Toque no alto-falante para ouvir de novo.</span></div>
    <div id="tapWrap"></div>
    <p class="feedback" aria-live="polite"></p>${nextRow()}`;
  const board = U.board();
  if (U.id === 'u6'){ const f = document.createElement('div'); f.className = 'frame'; f.appendChild(board); $('#tapWrap').appendChild(f); }
  else $('#tapWrap').appendChild(board);
  setTimeout(() => say(w.en), 250);
  let tries = 0, done = false;
  const fb = box.querySelector('.feedback');
  const pick = g => {
    if (done || !g) return;
    const k = g.dataset.k;
    if (U.accepts(w.k, k)){
      done = true; U.mark(board, w.k);
      const p = praise();
      fb.className = 'feedback ok'; fb.innerHTML = `${p} <span lang="en-GB">${esc(w.en)}</span>! ★`;
      say(`${p} The ${w.en}!`);
      reinDone(tries === 0, w.k);
    } else {
      tries++; U.mark(board, k, 'bad');
      const other = U.by[k].en;
      if (tries >= 2){
        done = true;
        setTimeout(() => U.mark(board, w.k), 700);
        fb.className = 'feedback no'; fb.innerHTML = `Aqui está: <span lang="en-GB">${esc(w.en)}</span> (${w.pt}).`;
        say(`That's the ${other}. Here is the ${w.en}.`);
        reinDone(false, w.k);
      } else {
        fb.className = 'feedback no'; fb.innerHTML = `Isso é <span lang="en-GB">${esc(other)}</span>. Tente de novo!`;
        say(`That's the ${other}. Try again!`);
      }
    }
  };
  board.addEventListener('click', e => pick(e.target.closest('.part')));
  board.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('part') && e.target.tagName !== 'BUTTON'){ e.preventDefault(); pick(e.target); } });
}

// Monte a palavra (letra por letra)
function spellRound(w){
  const box = $('#qbox');
  const letters = w.en.replace(/ /g,'').split('');
  const tiles = shuffle(letters.map(ch => ({ch})));
  box.innerHTML = `${reinHeader()}
    <div class="ask"><h2 lang="en-GB">Spell it!</h2><span class="ptq">Monte a palavra com as letras</span></div>
    <div class="picslot"></div>
    <div class="row" style="justify-content:flex-start">${sayBtn(w.en, true)}<span>Em português: <b>${w.pt}</b></span></div>
    <div class="slots" lang="en-GB">${w.en.split('').map(ch => ch === ' ' ? '<span class="slot gap"></span>' : '<span class="slot" data-slot></span>').join('')}</div>
    <div class="tiles">${tiles.map((t,n) => `<button class="tile" data-n="${n}" aria-label="letra ${esc(t.ch)}">${esc(t.ch)}</button>`).join('')}</div>
    <p class="feedback" aria-live="polite"></p>${nextRow()}`;
  box.querySelector('.picslot').replaceWith(U.pic(w.k));
  const slots = [...box.querySelectorAll('[data-slot]')];
  const fb = box.querySelector('.feedback');
  let pos = 0, errors = 0;
  box.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    const t = tiles[+b.dataset.n];
    if (t.ch === letters[pos]){
      slots[pos].textContent = t.ch; slots[pos].classList.add('pop');
      b.disabled = true; pos++;
      box.querySelectorAll('.tile.hintme').forEach(x => x.classList.remove('hintme'));
      if (pos === letters.length){
        const p = praise();
        fb.className = 'feedback ok'; fb.textContent = `${p} ★`;
        say(`${w.en}! ${p}`);
        reinDone(errors < 3, w.k);
      }
    } else {
      errors++;
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      if (errors >= 3){
        const good = [...box.querySelectorAll('.tile')].find(x => !x.disabled && tiles[+x.dataset.n].ch === letters[pos]);
        if (good) good.classList.add('hintme');
        fb.className = 'feedback no'; fb.textContent = 'A letra que pisca é a próxima!';
      }
    }
  });
}

// Monte a frase (palavra por palavra)
function buildRound(q){
  const box = $('#qbox');
  const tiles = shuffle(q.words.map(t => ({t})));
  const full = q.words.join(' ') + q.end;
  box.innerHTML = `${reinHeader()}
    <div class="ask"><h2 lang="en-GB">Build the sentence!</h2><span class="ptq">Monte a frase na ordem certa</span></div>
    <div class="picslot"></div>
    <div class="row" style="justify-content:flex-start">${sayBtn(full, true)}<span>Em português: <b>${q.pt}</b></span></div>
    <div class="wslots" lang="en-GB" aria-live="polite"></div>
    <div class="tiles">${tiles.map((t,n) => `<button class="tile" data-n="${n}">${esc(t.t)}</button>`).join('')}</div>
    <p class="feedback" aria-live="polite"></p>${nextRow()}`;
  box.querySelector('.picslot').replaceWith(q.pic);
  const out = box.querySelector('.wslots');
  const fb = box.querySelector('.feedback');
  let pos = 0, errors = 0;
  box.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    const t = tiles[+b.dataset.n].t;
    if (t === q.words[pos]){
      const s = document.createElement('span'); s.className = 'wslot pop';
      s.textContent = t + (pos === q.words.length-1 ? q.end : '');
      out.appendChild(s);
      b.disabled = true; pos++;
      box.querySelectorAll('.tile.hintme').forEach(x => x.classList.remove('hintme'));
      if (pos === q.words.length){
        const p = praise();
        fb.className = 'feedback ok'; fb.textContent = `${p} ★`;
        say(`${full} ${p}`);
        reinDone(errors < 3);
      }
    } else {
      errors++;
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      if (errors >= 2){
        const good = [...box.querySelectorAll('.tile')].find(x => !x.disabled && tiles[+x.dataset.n].t === q.words[pos]);
        if (good) good.classList.add('hintme');
        fb.className = 'feedback no'; fb.textContent = 'A palavra que pisca é a próxima!';
      }
    }
  });
}
function reinEnd(){
  const st = S[U.id];
  const right = F.right;
  const stars = right >= 9 ? 3 : right >= 6 ? 2 : 1;
  st.missed = st.missed.filter(k => (st.m[k]||0) < 1);
  if (right >= 8) st.gramMiss = 0;
  save();
  $('#qbox').innerHTML = `<div class="result intro">
    <p class="eyebrow">Reforçar · resultado</p>
    <p class="big">${right} de ${F.items.length}</p>
    <p class="stars" aria-label="${stars} estrelas">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
    <p>${right >= 8 ? 'Pronto para a prova nesta unidade!' : 'Mais uma rodada e fica na cabeça.'}</p>
    <div class="row" style="justify-content:center"><button class="go" id="againRein">Reforçar de novo</button><button class="go alt" data-goto="recall">Relembrar de novo</button></div>
  </div>`;
  say(right >= 8 ? 'Brilliant! You are ready!' : 'Well done! Let’s play again.');
  $('#againRein').onclick = startRein;
}

/* ---------- Zerar progresso ---------- */
function footIdle(){
  const foot = $('#foot');
  foot.innerHTML = '<span>v2</span><button class="link" id="resetBtn">Zerar progresso</button>';
  $('#resetBtn').onclick = () => {
    foot.innerHTML = `<span>Apagar estrelas e palavras descobertas das duas unidades?</span><button class="link" id="yesReset">Sim, zerar</button><button class="link" id="noReset">Cancelar</button>`;
    $('#noReset').onclick = footIdle;
    $('#yesReset').onclick = () => { S = {u6: blank(), u7: blank()}; save(); home(); };
  };
}

home();

// Modo offline
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
