<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" content="#CFE6F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>No. 7 Primrose Lane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Tema único e deliberado (livro ilustrado), cores explícitas */
  :root{
    --page:#E3EEF3; --paper:#FFFFFF; --ink:#26313D; --mute:#56657A;
    --sky:#CFE6F2; --brick:#B5523B; --door:#C8322E; --sage:#7FA66B;
    --sage-lt:#DDEDD3; --butter:#F6D66B; --butter-lt:#FDF1C4; --red-lt:#F8D9D2;
    --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px}
  .shell{max-width:1120px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
  h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,.part:focus-visible{outline:3px solid var(--door);outline-offset:3px}

  /* Topo */
  .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{flex:none}
  .brand h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.01em}
  .brand p{color:var(--mute);font-size:15px}
  .score{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .pill .star{color:#D9A400}

  /* Passos: a ordem é real (explorar, relembrar, reforçar) */
  .steps{display:flex;flex-wrap:wrap;gap:10px}
  .step{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:8px 16px 8px 8px;box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-weight:700;font-size:19px;transition:transform .12s}
  .step:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .step .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sky);border:2px solid var(--ink);font-size:17px}
  .step[aria-current="step"]{background:var(--butter)}
  .step[aria-current="step"] .n{background:var(--paper)}
  .step small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--mute);line-height:1.1}

  /* Explorar */
  .stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
  .frame{background:var(--sky);border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
  .frame svg{display:block;width:100%;height:auto}
  .hint{font-size:15px;color:var(--mute);margin-top:10px}
  .card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px}
  .zoombox{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sky)}
  .zoombox svg{display:block;width:100%;height:auto;aspect-ratio:4/3;max-width:100%}
  .wordrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .word{font-size:clamp(36px,5vw,48px);font-weight:800;color:var(--brick)}
  .pt{font-size:19px}
  .pt b{font-weight:700}
  .som{font-size:15px;color:var(--mute)}
  .som b{color:var(--ink);letter-spacing:.04em}
  .ukus{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;letter-spacing:.04em;text-transform:uppercase}
  .tag.uk{background:var(--butter-lt)}
  .tag.us{background:#EEF1F4;color:var(--mute);border-color:#9AA6B4;text-decoration:line-through;text-decoration-thickness:2px}
  .ex{display:flex;gap:10px;align-items:flex-start;background:var(--page);border-radius:12px;padding:10px 12px}
  .ex .en{font-weight:700}
  .ex .ptx{color:var(--mute);font-size:15px}
  .note{font-size:15px;border-left:4px solid var(--butter);padding-left:10px}
  .yourturn{font-family:var(--display);font-weight:700;font-size:18px;color:var(--sage)}
  .say{flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--butter);width:48px;height:48px;box-shadow:2px 2px 0 var(--ink)}
  .say.sm{width:36px;height:36px;box-shadow:none}
  .say:active{transform:translate(1px,1px)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:5px 12px;font-weight:700;font-size:15px}
  .chip.seen{background:var(--sage-lt)}
  .chip.seen::before{content:"✓ ";color:#3E7A2F}
  .chip.on{background:var(--butter)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .count{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

  .go{border:3px solid var(--ink);border-radius:14px;background:var(--door);color:#fff;font-family:var(--display);font-weight:800;font-size:21px;padding:10px 22px;box-shadow:4px 4px 0 var(--ink)}
  .go.alt{background:var(--paper);color:var(--ink)}
  .go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

  /* Jogos */
  .game{max-width:720px;margin:0 auto;width:100%}
  .game .card{gap:14px}
  .eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
  .progress{display:flex;gap:6px;flex-wrap:wrap}
  .progress i{width:22px;height:8px;border-radius:4px;background:#D2DCE3}
  .progress i.done{background:var(--sage)}
  .progress i.miss{background:var(--door)}
  .progress i.now{background:var(--butter);outline:2px solid var(--ink)}
  .ask{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ask h2{font-size:clamp(28px,4vw,36px);font-weight:800}
  .ask .ptq{color:var(--mute);font-size:16px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:10px;align-items:center}
  .optbtn{flex:1;text-align:left;border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:10px 16px;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,28px);box-shadow:3px 3px 0 var(--ink)}
  .optbtn:disabled{cursor:default}
  .optbtn.ok{background:var(--sage-lt);border-color:#3E7A2F}
  .optbtn.no{background:var(--red-lt);border-color:var(--door)}
  .feedback{font-family:var(--display);font-weight:800;font-size:24px;min-height:1.2em}
  .feedback.ok{color:#3E7A2F}
  .feedback.no{color:var(--door)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .pop{animation:pop .3s}
  @keyframes pop{50%{transform:scale(1.06)}}

  .slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .slot{width:42px;height:54px;border-bottom:4px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px;color:var(--brick)}
  .slot.gap{width:18px;border:0}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .tile{width:54px;height:54px;border:3px solid var(--ink);border-radius:12px;background:var(--butter-lt);font-family:var(--display);font-weight:800;font-size:28px;box-shadow:3px 3px 0 var(--ink)}
  .tile:disabled{opacity:.25;box-shadow:none;cursor:default}
  .tile.hintme{background:var(--butter);animation:pop .6s infinite}

  .result{text-align:center;align-items:center}
  .big{font-size:clamp(40px,7vw,64px);font-weight:800;color:var(--brick)}
  .stars{font-size:34px;letter-spacing:4px;color:#D9A400}
  .intro{display:flex;flex-direction:column;gap:12px}
  .intro h2{font-size:clamp(30px,4.4vw,40px);font-weight:800}
  .foot{display:flex;justify-content:flex-end;gap:10px;align-items:center;font-size:14px;color:var(--mute)}
  .link{background:none;border:0;text-decoration:underline;color:var(--mute);padding:4px}

  /* Casa */
  .part{cursor:pointer;transition:filter .15s}
  .part:hover{filter:brightness(1.08) saturate(1.1)}
  .hlbox{fill:none;stroke:#E8412E;stroke-width:4;stroke-dasharray:10 6;pointer-events:none;animation:march 1s linear infinite}
  .hlbox.bad{stroke:#56657A}
  @keyframes march{to{stroke-dashoffset:-32}}
  .smoke circle{animation:puff 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .smoke circle:nth-child(2){animation-delay:1.1s}
  .smoke circle:nth-child(3){animation-delay:2.2s}
  @keyframes puff{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:.9}100%{opacity:0;transform:translateY(-18px) scale(1.4)}}

  @media (prefers-reduced-motion: reduce){
    .hlbox,.smoke circle,.tile.hintme,.shake,.pop{animation:none}
  }
  @media (max-width: 860px){
    .stage{grid-template-columns:1fr}
  }
  @media (max-width: 480px){
    .step{font-size:17px;padding-right:12px}
    .step small{display:none}
    .slot{width:32px;height:46px;font-size:26px}
    .tile{width:48px;height:48px;font-size:24px}
  }
</style>
<style>
  /* Base (equivale ao esqueleto do artefato) + ajustes de toque para iPad */
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  *{-webkit-tap-highlight-color:transparent}
  body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
</style>
</head>
<body>


<!-- Texturas compartilhadas pela casa e pelos recortes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#B5523B"/><path d="M0 .5H24M0 6.5H24M6 0V6M18 6V12" stroke="#94412F" stroke-width="1" fill="none"/></pattern>
    <pattern id="tiles" width="14" height="9" patternUnits="userSpaceOnUse"><rect width="14" height="9" fill="#5B6573"/><path d="M0 9Q3.5 3 7 9Q10.5 3 14 9" fill="none" stroke="#434B57" stroke-width="1.2"/></pattern>
    <pattern id="stone" width="30" height="18" patternUnits="userSpaceOnUse"><rect width="30" height="18" fill="#8C7B6A"/><path d="M0 .5H30M0 9.5H30M10 0V9M24 9V18" stroke="#6F604F" fill="none"/></pattern>

  </defs>
</svg>

<div class="shell">
  <header class="top">
    <div class="brand">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><path d="M6 24 26 8l20 16" fill="#5B6573" stroke="#26313D" stroke-width="3" stroke-linejoin="round"/><rect x="11" y="23" width="30" height="24" fill="#B5523B" stroke="#26313D" stroke-width="3"/><rect x="21" y="31" width="10" height="16" fill="#C8322E" stroke="#26313D" stroke-width="2"/><circle cx="26" cy="36" r="1.6" fill="#F6D66B"/></svg>
      <div>
        <h1>No. 7 Primrose Lane</h1>
        <p>As partes da casa em inglês britânico</p>
      </div>
    </div>
    <div class="score">
      <span class="pill" title="Palavras descobertas"><span id="seenCount">0</span>/18 descobertas</span>
      <span class="pill" title="Estrelas ganhas"><span class="star">★</span> <span id="starCount">0</span></span>
    </div>
  </header>

  <nav class="steps" aria-label="Etapas">
    <button class="step" data-step="explore" aria-current="step"><span class="n">1</span><span>Explorar<small>toque e ouça</small></span></button>
    <button class="step" data-step="recall"><span class="n">2</span><span>Relembrar<small>o que é isso?</small></span></button>
    <button class="step" data-step="reinforce"><span class="n">3</span><span>Reforçar<small>ouvir e escrever</small></span></button>
  </nav>

  <!-- 1. EXPLORAR -->
  <section id="s-explore">
    <div class="stage">
      <div>
        <div class="frame" id="houseFrame">
          <svg id="house" viewBox="0 0 800 600" role="img" aria-label="Casa em corte com todos os cômodos">
            <rect width="800" height="480" fill="#CFE6F2"/>

              <rect x="42" y="384" width="12" height="90" fill="#7A5236"/>
              <circle cx="48" cy="370" r="30" fill="#5E8F4E"/><circle cx="24" cy="390" r="20" fill="#6FA35C"/><circle cx="72" cy="390" r="20" fill="#6FA35C"/>
              <circle cx="36" cy="364" r="4" fill="#C8322E"/><circle cx="62" cy="380" r="4" fill="#C8322E"/><circle cx="30" cy="392" r="4" fill="#C8322E"/>
              <g stroke="#3E7A2F" stroke-width="2"><line x1="150" y1="474" x2="150" y2="460"/><line x1="162" y1="474" x2="162" y2="456"/><line x1="172" y1="474" x2="172" y2="462"/></g>
              <circle cx="150" cy="458" r="5" fill="#F6D66B"/><circle cx="162" cy="454" r="5" fill="#E88BB0"/><circle cx="172" cy="460" r="5" fill="#FFFFFF"/>
            </g>

            <!-- fence -->
            <g class="part" data-k="fence">
              <rect x="0" y="454" width="88" height="4" fill="#E4DCCB" stroke="#26313D" stroke-width=".8"/>
              <rect x="0" y="466" width="88" height="4" fill="#E4DCCB" stroke="#26313D" stroke-width=".8"/>
              <g fill="#F2EEE6" stroke="#26313D" stroke-width="1">
                <path d="M4 478V450l4-6 4 6v28Z"/><path d="M16 478V450l4-6 4 6v28Z"/><path d="M28 478V450l4-6 4 6v28Z"/><path d="M40 478V450l4-6 4 6v28Z"/><path d="M52 478V450l4-6 4 6v28Z"/><path d="M64 478V450l4-6 4 6v28Z"/><path d="M76 478V450l4-6 4 6v28Z"/>

            <!-- paredes -->

            <!-- loft -->

            <!-- bedroom -->

            <!-- window -->
            <g class="part" data-k="window">
              <rect x="300" y="228" width="72" height="54" fill="#CFE6F2" stroke="#FFFFFF" stroke-width="5"/>
              <path d="M336 228v54M300 255h72" stroke="#FFFFFF" stroke-width="3"/>
              <path d="M290 224h15q-4 30 4 60h-19Z" fill="#F6D66B" stroke="#26313D" stroke-width="1"/>
              <path d="M382 224h-15q4 30-4 60h19Z" fill="#F6D66B" stroke="#26313D" stroke-width="1"/>
              <path d="M286 224h100" stroke="#8A5A3C" stroke-width="3"/>
              <rect x="296" y="282" width="80" height="5" fill="#FFFFFF" stroke="#26313D" stroke-width=".8"/>
            </g>

            <!-- bathroom -->
            <g class="part" data-k="bathroom">
              <rect x="400" y="220" width="170" height="115" fill="url(#bathtile)"/>
              <ellipse cx="462" cy="252" rx="15" ry="19" fill="#EAF6FA" stroke="#7FA0A8" stroke-width="2.5"/>
              <rect x="508" y="230" width="42" height="30" fill="#EEF3F5" stroke="#FFFFFF" stroke-width="4"/>

<script>
/* ---------- Vocabulário (inglês britânico) ---------- */
const WORDS = [

  {k:'window',en:'window',pt:'janela',som:'UÍN-dou',ex:'Look out of the window!',exPt:'Olhe pela janela!',box:[282,216,108,76]},

  {k:'living',en:'living room',pt:'sala de estar',som:'LI-vin rum',ex:'We sit by the fire in the living room.',exPt:'A gente senta perto da lareira na sala.',note:'Os ingleses também dizem <b lang="en-GB">lounge</b>.',box:[324,340,132,144]},
  {k:'kitchen',en:'kitchen',pt:'cozinha',som:'KI-tchin',ex:'Dad makes tea in the kitchen.',exPt:'O papai faz chá na cozinha.',note:'O fogão é o <b lang="en-GB">cooker</b> e a torneira é o <b lang="en-GB">tap</b>.',box:[454,340,122,144]},
  {k:'cellar',en:'cellar',pt:'porão',som:'SÉ-la',us:'basement',ex:"It's dark in the cellar.",exPt:'Está escuro no porão.',box:[176,482,408,110]},

  {k:'garden',en:'garden',pt:'jardim / quintal',som:'GAA-den',us:'yard',ex:"Let's play in the garden!",exPt:'Vamos brincar no jardim!',box:[0,330,186,156]},
  {k:'fence',en:'fence',pt:'cerca',som:'FÉNS',ex:'The fence goes round the garden.',exPt:'A cerca fica em volta do jardim.',box:[0,436,90,46]},

  {k:'first',en:'first floor',pt:'primeiro andar',som:'FÂRST flóor',us:'second floor',ex:'My bedroom is on the first floor.',exPt:'Meu quarto fica no primeiro andar.',note:'É o andar de cima do térreo. Nos EUA, chamam de <b lang="en-US">second floor</b>.',box:[730,242,60,60]},
  {k:'ground',en:'ground floor',pt:'térreo',som:'GRAUND flóor',us:'first floor',ex:'The kitchen is on the ground floor.',exPt:'A cozinha fica no térreo.',note:'Nos elevadores ingleses, o térreo é o botão <b>G</b>.',box:[730,390,60,60]},
];
const BY = Object.fromEntries(WORDS.map(w => [w.k, w]));
const PRAISE = ['Brilliant!','Well done!','Spot on!','Lovely!','Great job!'];
const SPK = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

/* ---------- Progresso (só neste navegador) ---------- */
const KEY = 'no7-primrose';
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
let S = Object.assign({seen:{}, m:{}, missed:[], stars:0}, load() || {});
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- Voz em inglês britânico ---------- */
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices(); } catch(e){} }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  return voices.find(v => v.lang === lang && /female|google|serena|kate|libby|sonia/i.test(v.name))
      || voices.find(v => v.lang === lang)
      || voices.find(v => v.lang && v.lang.replace('_','-').startsWith(lang))
      || null;
}
function say(text, lang='en-GB', rate=.85){
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate;
    const v = pickVoice(lang); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) say(b.dataset.say);
});

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
const house = $('#house');
const NS = 'http://www.w3.org/2000/svg';

function setHL(svg, box, cls=''){
  svg.querySelectorAll('.hlbox').forEach(n => n.remove());
  if (!box) return;
  const r = document.createElementNS(NS,'rect');
  r.setAttribute('class','hlbox '+cls);
  r.setAttribute('x',box[0]+4); r.setAttribute('y',box[1]+4);
  r.setAttribute('width',box[2]-8); r.setAttribute('height',box[3]-8);
  r.setAttribute('rx',10);
  svg.appendChild(r);
}
// Recorte ilustrado de uma parte da casa (reaproveita o desenho principal)
function zoom(k, withBox=true){
  const w = BY[k];
  const c = house.cloneNode(true);
  c.removeAttribute('id');
  c.querySelectorAll('.hlbox').forEach(n => n.remove());
  c.querySelectorAll('[tabindex]').forEach(n => { n.removeAttribute('tabindex'); n.removeAttribute('role'); });
  const [x,y,wd,ht] = w.box;
  // enquadra em 4:3 centralizado na parte
  const ar = 4/3; let W = wd, H = ht;
  if (W/H > ar) H = W/ar; else W = H*ar;
  c.setAttribute('viewBox', [x-(W-wd)/2, y-(H-ht)/2, W, H].join(' '));
  c.setAttribute('preserveAspectRatio','xMidYMid slice');
  c.setAttribute('aria-hidden','true');
  c.style.pointerEvents = 'none';
  if (withBox) setHL(c, w.box);
  return c;
}
function fullHouse(){
  const c = house.cloneNode(true);
  c.removeAttribute('id');
  c.querySelectorAll('.hlbox').forEach(n => n.remove());
  return c;
}
function refreshCounts(){
  const n = Object.keys(S.seen).length;
  $('#seenCount').textContent = n;
  $('#seenCount2').textContent = n;
  $('#starCount').textContent = S.stars;
}

/* ---------- Navegação entre etapas ---------- */
function showStep(id){
  ['explore','recall','reinforce'].forEach(s => { $('#s-'+s).hidden = s !== id; });
  document.querySelectorAll('.step').forEach(b => { if (b.dataset.step === id) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  if (id === 'recall') recallIntro();
  if (id === 'reinforce') reinIntro();
  window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => showStep(b.dataset.step)));
document.addEventListener('click', e => { const g = e.target.closest('[data-goto]'); if (g) showStep(g.dataset.goto); });

/* ---------- 1. EXPLORAR ---------- */
house.querySelectorAll('.part').forEach(g => {
  g.setAttribute('tabindex','0'); g.setAttribute('role','button');
  g.setAttribute('aria-label', BY[g.dataset.k].en);
});
house.addEventListener('click', e => { const g = e.target.closest('.part'); if (g) openWord(g.dataset.k, true); });
house.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('part')){ e.preventDefault(); openWord(e.target.dataset.k, true); }
});

let current = null;
function openWord(k, speak){
  const w = BY[k]; current = k;
  if (speak){ S.seen[k] = 1; save(); say(w.en); }
  setHL(house, w.box);
  const card = $('#wordCard');
  card.innerHTML = `
    <div class="zoombox"></div>
    <div class="wordrow">
      <h2 class="word" lang="en-GB">${w.en}</h2>
      <button class="say" data-say="${w.en}" aria-label="Ouvir ${w.en}">${SPK}</button>
    </div>
    <p class="som">Fala-se mais ou menos: <b>${w.som}</b></p>
    <p class="pt">Em português: <b>${w.pt}</b></p>
    ${w.us ? `<div class="ukus"><span class="tag uk">Inglaterra: ${w.en}</span><span class="tag us">EUA: ${w.us}</span></div>` : ''}
    <div class="ex">
      <button class="say sm" data-say="${w.ex.replace(/"/g,'&quot;')}" aria-label="Ouvir a frase">${SPK}</button>
      <div><p class="en" lang="en-GB">${w.ex}</p><p class="ptx">${w.exPt}</p></div>
    </div>
    ${w.note ? `<p class="note">${w.note}</p>` : ''}
    <p class="yourturn">Sua vez: repita bem alto!</p>`;
  card.querySelector('.zoombox').appendChild(zoom(k, false));
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  renderChips(); refreshCounts();
}
function renderChips(){
  $('#chips').innerHTML = WORDS.map(w =>
    `<button class="chip ${S.seen[w.k]?'seen':''} ${current===w.k?'on':''}" data-open="${w.k}" lang="en-GB">${w.en}</button>`).join('');
}
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openWord(b.dataset.open, true); });

/* ---------- 2. RELEMBRAR ---------- */
let R = null;
function recallIntro(){
  const n = Object.keys(S.seen).length;
  $('#recallBox').innerHTML = `
    <div class="intro">
      <p class="eyebrow">Passo 2 · Relembrar</p>
      <h2>Você lembra o nome?</h2>
      <p>Vou mostrar um pedaço da casa. Escolha o nome certo em inglês. Se precisar, toque no alto-falante para ouvir cada palavra antes de escolher.</p>
      ${n < 6 ? `<p class="note">Você descobriu ${n} de 18 partes. Dá para jogar mesmo assim, mas fica mais fácil explorando mais um pouco antes.</p>` : ''}
      <div class="row"><button class="go" id="startRecall">Começar (10 perguntas)</button><button class="go alt" data-goto="explore">Explorar mais</button></div>
    </div>`;
  $('#startRecall').onclick = startRecall;
}
function startRecall(){
  const seen = shuffle(WORDS.filter(w => S.seen[w.k]));
  const rest = shuffle(WORDS.filter(w => !S.seen[w.k]));
  const q = seen.concat(rest).slice(0, 10);
  R = {q: shuffle(q), i: 0, marks: [], missed: []};
  recallQ();
}
function progressBar(total, marks, i){
  let h = '<div class="progress" aria-hidden="true">';
  for (let j = 0; j < total; j++) h += `<i class="${marks[j] ? marks[j] : (j===i ? 'now' : '')}"></i>`;
  return h + '</div>';
}
function recallQ(){
  const w = R.q[R.i];
  const opts = shuffle([w, ...shuffle(WORDS.filter(x => x.k !== w.k)).slice(0,2)]);
  const box = $('#recallBox');
  box.innerHTML = `
    <div class="row"><p class="eyebrow">Relembrar · ${R.i+1} de ${R.q.length}</p>${progressBar(R.q.length, R.marks, R.i)}</div>
    <div class="zoombox"></div>
    <div class="ask"><h2 lang="en-GB">What's this?</h2><span class="ptq">O que é isso?</span></div>
    <div class="opts">${opts.map(o => `
      <div class="opt">
        <button class="optbtn" data-k="${o.k}" lang="en-GB">${o.en}</button>
        <button class="say sm" data-say="${o.en}" aria-label="Ouvir ${o.en}">${SPK}</button>
      </div>`).join('')}
    </div>
    <p class="feedback" aria-live="polite"></p>
    <div class="row" id="nextRow" hidden><span></span><button class="go" id="nextQ">${R.i+1 < R.q.length ? 'Próxima →' : 'Ver resultado →'}</button></div>`;
  box.querySelector('.zoombox').appendChild(zoom(w.k));
  box.querySelectorAll('.optbtn').forEach(b => b.onclick = () => answerRecall(b, w));
}
function answerRecall(btn, w){
  const box = $('#recallBox');
  box.querySelectorAll('.optbtn').forEach(b => b.disabled = true);
  const fb = box.querySelector('.feedback');
  if (btn.dataset.k === w.k){
    btn.classList.add('ok','pop');
    const p = PRAISE[Math.random()*PRAISE.length|0];
    fb.className = 'feedback ok'; fb.textContent = `${p} ★`;
    say(`${w.en}! ${p}`);
    R.marks[R.i] = 'done';
    S.m[w.k] = Math.min(3, (S.m[w.k]||0) + 1); S.stars++;
  } else {
    btn.classList.add('no','shake');
    box.querySelector(`.optbtn[data-k="${w.k}"]`).classList.add('ok');
    fb.className = 'feedback no'; fb.innerHTML = `Quase! Este é o <span lang="en-GB">${w.en}</span>.`;
    say(`This is the ${w.en}.`);
    R.marks[R.i] = 'miss'; R.missed.push(w.k);
    S.m[w.k] = Math.max(0, (S.m[w.k]||0) - 1);
  }
  S.seen[w.k] = 1; save(); refreshCounts();
  $('#nextRow').hidden = false;
  $('#nextQ').focus();
  $('#nextQ').onclick = () => { R.i++; R.i < R.q.length ? recallQ() : recallEnd(); };
}
function recallEnd(){
  const right = R.q.length - R.missed.length;
  S.missed = [...new Set(R.missed)]; save();
  const stars = right >= 9 ? 3 : right >= 6 ? 2 : 1;
  $('#recallBox').innerHTML = `
    <div class="result card" style="border:0;box-shadow:none;padding:0">
      <p class="eyebrow">Relembrar · resultado</p>
      <p class="big">${right} de ${R.q.length}</p>
      <p class="stars" aria-label="${stars} estrelas">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
      ${S.missed.length
        ? `<p>Estas ficaram difíceis. Vamos treinar elas no reforço:</p>
           <div class="chips" style="justify-content:center">${S.missed.map(k => `<span class="chip" lang="en-GB">${BY[k].en}</span>`).join('')}</div>`
        : `<p>Acertou tudo! No reforço vamos ouvir e escrever as palavras.</p>`}
      <div class="row" style="justify-content:center"><button class="go" data-goto="reinforce">Reforçar agora →</button><button class="go alt" id="againRecall">Jogar de novo</button></div>
    </div>`;
  say(right >= 8 ? 'Brilliant! Well done!' : 'Good try! Let’s practise.');
  $('#againRecall').onclick = startRecall;
}

/* ---------- 3. REFORÇAR ---------- */
let F = null;
function reinIntro(){
  const has = S.missed.length;
  $('#reinBox').innerHTML = `
    <div class="intro">
      <p class="eyebrow">Passo 3 · Reforçar</p>
      <h2>Ouça, toque e escreva</h2>
      <p>Dois jogos misturados: primeiro você <b>ouve</b> a palavra e toca na parte certa da casa. Depois você <b>monta</b> a palavra com as letras.</p>
      <p class="note">${has
        ? `Vou repetir mais vezes as que ficaram difíceis: <b lang="en-GB">${S.missed.map(k => BY[k].en).join(', ')}</b>.`
        : 'Faça o Relembrar antes para eu saber quais palavras treinar mais. Sem ele, eu escolho as que você ainda não domina.'}</p>
      <div class="row"><button class="go" id="startRein">Começar (8 rodadas)</button>${has ? '' : '<button class="go alt" data-goto="recall">Ir para Relembrar</button>'}</div>
    </div>`;
  $('#startRein').onclick = startRein;
}
function startRein(){
  const base = S.missed.slice();
  let q = [...base, ...base];
  const weak = shuffle(WORDS.filter(w => !base.includes(w.k) && (S.m[w.k]||0) < 2)).map(w => w.k);
  const rest = shuffle(WORDS.filter(w => !base.includes(w.k) && !weak.includes(w.k))).map(w => w.k);
  q = q.concat(weak, rest).slice(0, 8);
  q = shuffle(q);
  // evita a mesma palavra duas vezes seguidas
  for (let i = 1; i < q.length; i++) if (q[i] === q[i-1]){
    const j = q.findIndex((x, idx) => idx > i && x !== q[i]); if (j > -1) [q[i], q[j]] = [q[j], q[i]];
  }
  F = {q, i: 0, marks: [], right: 0};
  reinRound();
}
function reinHeader(title, pt){
  return `<div class="row"><p class="eyebrow">Reforçar · ${F.i+1} de ${F.q.length}</p>${progressBar(F.q.length, F.marks, F.i)}</div>
          <div class="ask"><h2>${title}</h2><span class="ptq">${pt}</span></div>`;
}
function reinRound(){ (F.i % 2 === 0 ? tapRound : spellRound)(BY[F.q[F.i]]); }
function reinNext(ok){
  F.marks[F.i] = ok ? 'done' : 'miss';
  const w = BY[F.q[F.i]];
  if (ok){ F.right++; S.stars++; S.m[w.k] = Math.min(3, (S.m[w.k]||0) + 1); }
  save(); refreshCounts();
  const row = $('#reinBox .next'); row.hidden = false;
  const b = row.querySelector('button'); b.focus();
  b.onclick = () => { F.i++; F.i < F.q.length ? reinRound() : reinEnd(); };
}
const nextBtn = () => `<div class="row next" hidden><span></span><button class="go">${F.i+1 < F.q.length ? 'Próxima →' : 'Ver resultado →'}</button></div>`;

// Jogo A: ouça e toque na casa
function tapRound(w){
  const box = $('#reinBox');
  box.innerHTML = `${reinHeader('Listen and tap!','Ouça e toque na parte certa da casa')}
    <div class="row" style="justify-content:flex-start"><button class="say" data-say="${w.en}" aria-label="Ouvir de novo">${SPK}</button><span>Toque no alto-falante para ouvir de novo.</span></div>
    <div class="frame" id="tapHouse"></div>
    <p class="feedback" aria-live="polite"></p>${nextBtn()}`;
  const svg = fullHouse();
  $('#tapHouse').appendChild(svg);
  setTimeout(() => say(w.en), 250);
  let tries = 0, done = false;
  const fb = box.querySelector('.feedback');
  const pick = g => {
    if (done || !g) return;
    const k = g.dataset.k;
    if (k === w.k){
      done = true; setHL(svg, w.box);
      const p = PRAISE[Math.random()*PRAISE.length|0];
      fb.className = 'feedback ok'; fb.innerHTML = `${p} Esse é o <span lang="en-GB">${w.en}</span>. ★`;
      say(`${p} The ${w.en}!`);
      reinNext(tries === 0);
    } else {
      tries++;
      setHL(svg, BY[k].box, 'bad');
      if (tries >= 2){
        done = true;
        setTimeout(() => setHL(svg, w.box), 700);
        fb.className = 'feedback no'; fb.innerHTML = `Aqui está: <span lang="en-GB">${w.en}</span> (${w.pt}).`;
        say(`That's the ${BY[k].en}. Here is the ${w.en}.`);
        reinNext(false);
      } else {
        fb.className = 'feedback no'; fb.innerHTML = `Isso é <span lang="en-GB">${BY[k].en}</span>. Tente de novo!`;
        say(`That's the ${BY[k].en}. Try again!`);
      }
    }
  };
  svg.addEventListener('click', e => pick(e.target.closest('.part')));
  svg.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('part')){ e.preventDefault(); pick(e.target); } });
}

// Jogo B: monte a palavra
function spellRound(w){
  const box = $('#reinBox');
  const letters = w.en.replace(/ /g,'').split('');
  const tiles = shuffle(letters.map((ch, i) => ({ch, i})));
  box.innerHTML = `${reinHeader('Spell it!','Monte a palavra com as letras')}
    <div class="zoombox"></div>
    <div class="row" style="justify-content:flex-start"><button class="say" data-say="${w.en}" aria-label="Ouvir a palavra">${SPK}</button><span>Dica: em português é <b>${w.pt}</b>.</span></div>
    <div class="slots" lang="en-GB">${w.en.split('').map(ch => ch === ' ' ? '<span class="slot gap"></span>' : '<span class="slot" data-slot></span>').join('')}</div>
    <div class="tiles">${tiles.map((t, n) => `<button class="tile" data-n="${n}" aria-label="letra ${t.ch}">${t.ch}</button>`).join('')}</div>
    <p class="feedback" aria-live="polite"></p>${nextBtn()}`;
  box.querySelector('.zoombox').appendChild(zoom(w.k));
  const slots = [...box.querySelectorAll('[data-slot]')];
  const fb = box.querySelector('.feedback');
  let pos = 0, errors = 0;
  box.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    const t = tiles[+b.dataset.n];
    if (t.ch === letters[pos]){
      slots[pos].textContent = t.ch; slots[pos].classList.add('pop');
      b.disabled = true; b.classList.remove('hintme'); pos++;
      box.querySelectorAll('.tile.hintme').forEach(x => x.classList.remove('hintme'));
      if (pos === letters.length){
        const p = PRAISE[Math.random()*PRAISE.length|0];
        fb.className = 'feedback ok'; fb.textContent = `${p} ★`;
        say(`${w.en}! ${p}`);
        reinNext(errors < 3);
      }
    } else {
      errors++;
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      if (errors >= 3){
        const good = [...box.querySelectorAll('.tile')].find(x => !x.disabled && tiles[+x.dataset.n].ch === letters[pos]);
        if (good) good.classList.add('hintme');
        fb.className = 'feedback no'; fb.textContent = 'A letra que pisca é a próxima!';
      }
    }
  });
}
function reinEnd(){
  const right = F.right;
  const stars = right >= 7 ? 3 : right >= 5 ? 2 : 1;
  // o que acertou no reforço sai da lista de difíceis
  S.missed = S.missed.filter(k => (S.m[k]||0) < 1); save();
  $('#reinBox').innerHTML = `
    <div class="result card" style="border:0;box-shadow:none;padding:0">
      <p class="eyebrow">Reforçar · resultado</p>
      <p class="big">${right} de ${F.q.length}</p>
      <p class="stars" aria-label="${stars} estrelas">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
      <p>${right >= 7 ? 'Você já sabe a casa inteira em inglês britânico!' : 'Mais uma rodada e essas palavras ficam na cabeça.'}</p>
      <div class="row" style="justify-content:center"><button class="go" id="againRein">Reforçar de novo</button><button class="go alt" data-goto="recall">Relembrar de novo</button></div>
    </div>`;
  say(right >= 7 ? 'Brilliant! You know the whole house!' : 'Well done! Let’s play again.');
  $('#againRein').onclick = startRein;
}

/* ---------- Zerar progresso (confirmação na própria página) ---------- */
function footIdle(){
  $('#foot').innerHTML = '<button class="link" id="resetBtn">Zerar progresso</button>';
  $('#resetBtn').onclick = () => {
    $('#foot').innerHTML = `<span>Apagar estrelas e palavras descobertas?</span><button class="link" id="yesReset">Sim, zerar</button><button class="link" id="noReset">Cancelar</button>`;
    $('#noReset').onclick = footIdle;
    $('#yesReset').onclick = () => {
      try { localStorage.removeItem(KEY); } catch(e){}
      S = {seen:{}, m:{}, missed:[], stars:0};
      footIdle(); showStep('explore'); openWord('roof', false); refreshCounts();
    };
  };
}
footIdle();

/* ---------- Estado inicial ---------- */
openWord('roof', false);
refreshCounts();
</script>
